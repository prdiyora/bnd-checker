<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <title>BND checker</title>
  <meta name="description" content="BND checker - uptime monitoring with email alerts." />
  <link rel="manifest" href="assets/site.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%2336d399'/></svg>" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>BND checker</h1>
          <span class="tagline">Uptime monitoring</span>
        </div>
      </div>
      <span class="live-pill"><span class="live-dot"></span><span id="updated">LIVE</span></span>
    </div>
  </header>

  <main class="wrap">
    <section class="summary" id="overview" hidden></section>
    <section class="quick-actions" id="quick-actions" hidden></section>
    <section class="grid" id="app">
      <p class="loading">Loading monitors…</p>
    </section>
    <section class="daylog" id="logs" hidden></section>
    <section class="incidents" id="incidents" hidden></section>
  </main>

  <footer class="wrap foot">
    <p>Checks run every 5 minutes. DOWN and UP alerts go out by email. Times shown in Asia/Kolkata.</p>
  </footer>

  <nav class="bottom-nav" aria-label="Sections">
    <a href="#overview" class="bn-item active" data-nav="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Overview</span>
    </a>
    <a href="#logs" class="bn-item" data-nav="logs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>Logs</span>
    </a>
    <a href="#incidents" class="bn-item" data-nav="incidents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <span>Incidents</span>
    </a>
  </nav>

  <script src="assets/app.js" type="module"></script>
</body>
</html>
