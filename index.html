<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BND checker</title>
  <meta name="description" content="BND checker - uptime monitoring with email alerts." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%2336d399'/></svg>" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <h1>BND checker</h1>
      </div>
      <span class="live-pill"><span class="live-dot"></span>LIVE</span>
    </div>
  </header>

  <main class="wrap">
    <section class="summary" id="summary" hidden></section>
    <section class="grid" id="app">
      <p class="loading">Loading monitors…</p>
    </section>
    <section class="incidents" id="incidents" hidden></section>
    <section class="daylog" id="daylog" hidden></section>
  </main>

  <footer class="wrap foot">
    <p>Checks run every 5 minutes. DOWN and UP alerts go out by email. <span id="updated"></span></p>
  </footer>

  <script src="assets/app.js" type="module"></script>
</body>
</html>
